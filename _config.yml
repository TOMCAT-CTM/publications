  - "2-s2.0-0346008085"    # duplicate: Millard 2003, A model study of the connection between polar...
  - "2-s2.0-1642397904"    # duplicate: Mann 2002, Polar vortex concentricity... (wrong DOI)
  - "2-s2.0-0242615803"    # duplicate: Kleinböhl 2003, Vortexwide denitrification of the Arctic...
  - "2-s2.0-0347269114"    # duplicate: Davies 2003, Modeling the effect of denitrification...
  - "2-s2.0-85054834664"   # duplicate: Griffin 2018, discussion paper of the 2019 ACP paper
  - "2-s2.0-0033589129"    # duplicate: Giannakopoulos 1999, Validation... (broken DOI)
  - "2-s2.0-0033296063"    # duplicate: Galle 1999, Ground based FTIR measurements...
